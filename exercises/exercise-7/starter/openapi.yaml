openapi: 3.0.3
info:
  title: Test Case API
  version: 1.0.0
  description: >
    Minimal test case management API for Exercise 7. The agent extends this
    document when it adds the DELETE /tests/{id} operation.
paths:
  /tests:
    get:
      summary: List all test cases
      responses:
        "200":
          description: An array of test cases
    post:
      summary: Register a test case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: The registered test case
        "400":
          description: Missing or invalid name
  /tests/{id}:
    get:
      summary: Fetch a single test case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The test case
        "404":
          description: Test case not found
    # TODO (agent): document the DELETE /tests/{id} operation here.
components:
  schemas:
    TestCase:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        automated:
          type: boolean
