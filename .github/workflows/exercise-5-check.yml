name: Exercise 5 Check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copilot-course-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd exercises/exercise-5/starter
          npm install

      - name: Install Playwright browsers
        run: |
          cd exercises/exercise-5/starter
          npx playwright install chromium --with-deps

      - name: Run accessibility tests
        run: |
          cd exercises/exercise-5/starter
          npm test

      - name: Check load-test thresholds are defined
        run: |
          set -e
          f=exercises/exercise-5/starter/k6/load-test.js
          if grep -q "^  // thresholds:" "$f"; then
            echo "::error::The thresholds block in k6/load-test.js is still commented out — define your performance budget."
            exit 1
          fi
          if ! grep -q "thresholds" "$f"; then
            echo "::error::k6/load-test.js must define a thresholds block with your performance budget."
            exit 1
          fi
          echo "load-test thresholds found."

      - name: Check defect report exists
        run: |
          set -e
          f=exercises/exercise-5/starter/DEFECT-REPORT.md
          if [ ! -f "$f" ]; then
            echo "::error::Create exercises/exercise-5/starter/DEFECT-REPORT.md with your defect report."
            exit 1
          fi
          if [ ! -s "$f" ]; then
            echo "::error::DEFECT-REPORT.md is empty — fill it in."
            exit 1
          fi
          echo "DEFECT-REPORT.md found."

      - name: Record completion
        run: |
          mkdir -p .github/completion
          touch .github/completion/exercise-5.complete

      - name: Commit completion marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/completion/exercise-5.complete
          if git diff --staged --quiet; then
            echo "Marker already present — nothing to commit."
          else
            git commit -m "chore: mark exercise 5 complete"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
